<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>EBNF2SyntaxDiagram</title>
    <link rel="stylesheet" href="assets/css/vendor/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

    <!-- See https://bootswatch.com/brite/ -->
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">EBNF2SyntaxDiagram</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
                aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                            aria-haspopup="true" aria-expanded="false">Datei</a>
                        <div class="dropdown-menu">
                            <span class="dropdown-item" id="open-file" role="button" tabindex="0">Grammatik Öffnen</span>
                            <button class="dropdown-item" type="button" id="save-file">Grammatik Speichern</button>
                            <span class="dropdown-item">Grafik exportieren</span>
                            <!--
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#">Letztes</a>
                            -->
                        </div>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                            aria-haspopup="true" aria-expanded="false">Einstellungen</a>
                        <div class="dropdown-menu">
                            <div class="dropdown-item">
                                <input class="form-check-input me-2" type="checkbox" id="colored-checkbox" checked>
                                <label class="form-check-label" for="colored-checkbox">Ausgabe in Farbe</label>
                            </div>
                            <div class="dropdown-item">
                                <input class="form-check-input me-2" type="checkbox" id="rule-names-checkbox" checked>
                                <label class="form-check-label" for="rule-names-checkbox">Regelnamen anzeigen</label>
                            </div>
                            <!--
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#">Letztes</a>
                            -->
                        </div>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                            aria-haspopup="true" aria-expanded="false">Hilfe</a>
                        <div class="dropdown-menu">
                            <button class="dropdown-item" type="button" id="insert-example">Zeig mir ein Beispiel</button>
                        </div>
                    </li>
                </ul>

            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">

                <!--<h1>EBNF in ein Syntaxiagramm umwandeln</h1>-->


                <div id="form-wrapper">
                    <div class="mb-3">
                        <label for="rulesInput" class="form-label">Grammatik in EBNF eingeben:</label>
                        <textarea class="form-control" id="rules-input" name="rules-input" rows="3" autocomplete="off"></textarea>
                    </div>

                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-primary" type="button" name="btn-generate" id="btn-generate"
                            value="generate">Generieren</button>
                        <button class="btn btn-danger" type="button" name="btn-clear-input" id="btn-clear-input">Alles
                            löschen</button>
                    </div>
                </div>


                <div id="svg-output"></div>

            </div>
        </div>

    </div>


    <script src="assets/js/vendor/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/vendor/rrdiagram/rrdiagram.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.getElementById("insert-example").addEventListener("click", function () {
            const rulesInput = document.getElementById("rules-input");
            rulesInput.value = 'coffee-order = size, " ", drink;\nsize = "small" | "medium" | "large";\ndrink = "coffee" | "tea";';
            rulesInput.focus();
        });
    </script>
    <input type="file" id="file-input" hidden>

</body>

</html>
